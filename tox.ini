[tox]
requires = tox>=4
env_list = py{38,39,310,311,312,313,314}-{min,latest}, py38-min-devmin, py38-build

[testenv]
extras = dev
deps =
    min: click==8.1.0
    min: requests==2.31.0
    min: tabulate==0.9.0
    min: tomli==1.1.0; python_version < '3.11'
    min: pytest<9; python_version < '3.11'
    devmin: pytest==7.0.0
    devmin: responses==0.23.0
commands_pre =
    min: python -c "import sys; from importlib.metadata import requires, version; from packaging.requirements import Requirement; from packaging.version import Version; expected = {'click': '8.1.0', 'requests': '2.31.0', 'tabulate': '0.9.0'}; expected.update((('tomli', '1.1.0'),) if sys.version_info < (3, 11) else ()); actual = dict((name, version(name)) for name in expected); assert actual == expected, actual; declared = tuple(map(Requirement, requires('moneybird-cli'))); assert all(any(req.name == name and any(spec.operator == '>=' and Version(spec.version) == Version(minimum) for spec in req.specifier) for req in declared) for name, minimum in expected.items()), 'Update tox minimum pins to match pyproject.toml'"
    devmin: python -c "from importlib.metadata import requires, version; from packaging.requirements import Requirement; from packaging.version import Version; expected = {'pytest': '7.0.0', 'responses': '0.23.0'}; actual = dict((name, version(name)) for name in expected); assert actual == expected, actual; declared = tuple(map(Requirement, requires('moneybird-cli'))); assert all(any(req.name == name and any(spec.operator == '>=' and Version(spec.version) == Version(minimum) for spec in req.specifier) for req in declared) for name, minimum in expected.items()), 'Update tox minimum pins to match pyproject.toml'"
commands = pytest -q

[testenv:py38-build]
skip_install = true
deps = build
commands = python -m build --outdir {envtmpdir}/dist