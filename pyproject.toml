[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "moneybird-cli"
dynamic = ["version"]
description = "Command-line interface for the Moneybird API"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
keywords = ["moneybird", "accounting", "cli", "invoicing", "bookkeeping"]
authors = [
    { name = "Koert van der Veer", email = "koert@ondergetekende.nl" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "tabulate>=0.9",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
]

[project.urls]
Homepage = "https://github.com/ondergetekende/moneybird-cli"
Repository = "https://github.com/ondergetekende/moneybird-cli"
Issues = "https://github.com/ondergetekende/moneybird-cli/issues"

[project.scripts]
moneybird = "moneybird_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
